<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Desplegable Lindo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a1a, #2c3e50);
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* Contenedor del menú */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        /* Botón del menú */
        .dropdown-button {
            padding: 15px 25px;
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            color: white;
            background: linear-gradient(45deg, #ff6bcb, #00ddeb);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dropdown-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            animation: shine 2.5s infinite;
        }

        .dropdown-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 221, 235, 0.5), 0 5px 25px rgba(255, 107, 203, 0.4);
        }

        /* Animación de brillo */
        @keyframes shine {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        /* Contenedor de la lista desplegable */
        .dropdown-content {
            display: none;
            position: absolute;
            background: linear-gradient(135deg, #2c3e50, #1a1a1a);
            min-width: 180px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            z-index: 1;
            top: 110%;
            left: 0;
            padding: 10px 0;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Mostrar lista al hacer hover */
        .dropdown:hover .dropdown-content {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Elementos de la lista */
        .dropdown-content a {
            color: #ffffff;
            padding: 12px 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .dropdown-content a:hover {
            background: rgba(255, 107, 203, 0.2);
            color: #00ddeb;
            padding-left: 25px;
        }

        /* Ícono decorativo */
        .dropdown-content a::before {
            content: '✨';
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="dropdown">
        <button class="dropdown-button">Menú Mágico ✨</button>
        <div class="dropdown-content">
            <a href="#">Opción Estelar</a>
            <a href="#">Aventura Cósmica</a>
            <a href="#">Ruta Lunar</a>
            <a href="#">Galaxia Secreta</a>
        </div>
    </div>
</body>
</html>
