<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>Galería Automática</title>
    <link rel="stylesheet" href="style.css">
    <style>
        

        .galeria {
            width: 1200px;
            position: relative; /* Added for button positioning */
            margin: auto;
        }

        .imagen-principal {
            width: 1200px;
            height: 600px;
        }

        .imagen-principal img {
            width: 960px; /* 80% of 1200px */
            height: 400px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            display: block;            
            margin: auto; /* Center without padding */
        }

        .miniaturas {
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            width: 1200px;
        }

        .miniaturas img {
            width: 100px;
            height: 70px;
            object-fit: cover;
            border: 2px solid transparent;
            border-radius: 5px;
            cursor: pointer;
            transition: border 0.3s ease;
        }

        .miniaturas img:hover {
            border: 2px solid #66b3ff;
        }

        .nav-buttons {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
        }

        footer {
            width: 1200px;
            text-align: center;
            padding: 20px;
            background: #ddd;
            margin: 20px auto 0;
        }
    </style>
</head>
<body>

    <div class="wrapper">
    <nav class="nav">
            <img src="Images/Gogo.png" alt="images" class="logo">
            <ul>
                <a href="Index.html" ><li>Inicio</li></a>
                <a href="" ><li>Sobre nosotros</li></a>
                <a href="gallery.html" ><li>Galería</li></a>                
                <a href="" ><li>Iniciar sesión</li></a>
                <a href="Admisiones.html" class="glow-button" ><li>¡Matrículas anuales!</li></a>
            </ul>
        </nav>   

<div >
    <h1 style="text-align: center;font-style: oblique; margin: 10px; font-size: 3rem; color: #037d8d;">
Galería  de fotos      </h1><br></div>
        

        <div class="galeria" id="galeria">
            <!-- Gallery content will be generated by JavaScript -->
        </div>
        
    </div>
    <script>
        // List of images in the Images/ folder
        const images = [
            'Images/Inst.jpg',
            'Images/1.png',
            'Images/10.png',
            'Images/11.png',
            'Images/12.png',
            'Images/13.png',
            'Images/14.png',
            'Images/15.png',
            'Images/16.png',
            'Images/1630508474.png',
            'Images/1630510780.jpg',
            'Images/17.png',
            'Images/1748104449.jpg',
            'Images/18.png',
            'Images/19.png',
            'Images/2.png',
            'Images/20.png',
            'Images/3.png',
            'Images/4.png',
            'Images/5.png',
            'Images/6.png',
            'Images/7.png',
            'Images/8.png',
            'Images/9.png',
            'Images/Conej.jpg',
            'Images/Gogo.png',
            
            'Images/Love.jpg',
            'Images/MainImg.jpg',
            'Images/book-1870000_1920.jpg',
            'Images/cloud.jpg',
            'Images/cloudNav.jpg',
            'Images/nature-6821966_1920.jpg',
            'Images/san-18.png',
            'Images/san-19.png',
            'Images/san-9.png',
            'Images/valores.jpg'
        ];

        // Get gallery container
        const galeria = document.getElementById('galeria');

        // Generate HTML for the gallery
        let html = '';
        if (images.length > 0) {
            // Main image
            html += `<div class="imagen-principal"><img id="imagenGrande" src="${images[0]}" alt="Imagen principal"></div>`;
            // Navigation buttons
            html += '<div class="nav-buttons">';
            html += '<button onclick="changeImage(-1)">❮</button>';
            html += '<button onclick="changeImage(1)">❯</button>';
            html += '</div>';
            // Thumbnails
            html += '<div class="miniaturas" id="contenedorMiniaturas">';
            images.forEach(img => {
                html += `<img src="${img}" onclick="document.getElementById('imagenGrande').src='${img}'" alt="Thumbnail">`;
            });
            html += '</div>';
        } else {
            html += '<p>No se encontraron imágenes en la carpeta.</p>';
        }

        // Inject HTML into gallery
        galeria.innerHTML = html;

        // Keep track of current image index
        let currentIndex = 0;

        // Function to change image (next/previous)
        function changeImage(direction) {
            currentIndex = (currentIndex + direction + images.length) % images.length;
            document.getElementById('imagenGrande').src = images[currentIndex];
        }
    </script>
</body>
</html>
